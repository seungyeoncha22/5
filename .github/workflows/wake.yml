name: Wake Streamlit apps

on:
  schedule:
    - cron: "0 */4 * * *"   # 4시간마다 (UTC 기준)
  workflow_dispatch:         # Actions 화면에서 직접 실행 가능

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 깨울 앱 주소, 쉼표로 구분 (v3 주소가 생기면 뒤에 추가)
      STREAMLIT_URLS: "https://localsim-team05.streamlit.app/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Wake apps
        run: python scripts/wake_streamlit.py
